server:
  port: ${PORT:4000}
  forward-headers-strategy: framework     # Render's proxy terminates HTTPS
spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/jack}
    username: ${SPRING_DATASOURCE_USERNAME:jack}
    password: ${SPRING_DATASOURCE_PASSWORD:jack}
    hikari:
      connection-timeout: 10000           # milliseconds, as the demo; fail fast (503) when the database is down
      # Close connections after a minute unused, so an idle app holds none open and Neon's
      # compute can scale to zero. The first request after a quiet spell reconnects (about 1 s).
      minimum-idle: 0
      idle-timeout: 60000                 # milliseconds
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                  # only Flyway changes the schema
  flyway:
    out-of-order: true
  jackson:
    # Whole-number fields (ids, quantities, cents) reject 2.7 and "5" instead of silently
    # storing 2 and 5; GlobalExceptionHandler reports them as field errors.
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never            # the Flyway migration creates the tables
      # Delete expired sessions daily at 04:00 UTC instead of every minute (the default), which
      # would keep Neon's compute awake. Expired sessions are rejected on use either way.
      cleanup-cron: "0 0 4 * * *"
springdoc:                                # API docs (OpenApiConfig); set API_DOCS_ENABLED=false to turn both off
  paths-to-match: /api/**
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method
exchange:                                 # currency conversion (ExchangeRateProperties)
  rate:
    api:
      base-url: ${EXCHANGE_RATE_API_BASE_URL:https://open.er-api.com/v6/latest}
  rates:
    source: ${EXCHANGE_RATES_SOURCE:live}  # live, or fallback to use only the bundled snapshot
    snapshot-location: ${EXCHANGE_RATES_SNAPSHOT_LOCATION:classpath:exchange-rates-fallback.json}
    retry-after: ${EXCHANGE_RATES_RETRY_AFTER:5m}  # after a failed fetch, reuse the last rates this long
  supported-currencies: ${EXCHANGE_SUPPORTED_CURRENCIES:CAD,USD,EUR,GBP,AUD}
