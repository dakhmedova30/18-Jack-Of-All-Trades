name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Publishing a GitHub release (e.g. the D4 tag) re-runs every check on the tagged commit,
  # then deploys that exact commit to prod. "released" skips pre-releases, and fires when one is
  # later promoted to a full release.
  release:
    types: [released]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The Maven wrapper downloads Maven itself on first use; caching it means a Maven Central
      # hiccup can't fail the build (it did on Nov 19).
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - run: ./mvnw -B test

  # End-to-end: builds the real app (the React client inside the Spring Boot jar, as the Docker
  # image does), starts it against Postgres, and drives it in Chromium (frontend/e2e).
  e2e:
    needs: [check, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jack
          POSTGRES_PASSWORD: jack
          POSTGRES_DB: jack
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jack
      SPRING_DATASOURCE_USERNAME: jack
      SPRING_DATASOURCE_PASSWORD: jack
      EXCHANGE_RATES_SOURCE: fallback # bundled rates: no outside API in the test run
      E2E_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The Maven wrapper downloads Maven itself on first use; caching it means a Maven Central
      # hiccup can't fail the build (it did on Nov 19).
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Build the client into the backend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../backend/src/main/resources/static
          cp -R client/dist/. ../backend/src/main/resources/static/
      - name: Build and start the app
        working-directory: backend
        run: |
          ./mvnw -B -q -DskipTests package
          java -jar target/backend-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health/live && exit 0
            sleep 1
          done
          cat app.log
          exit 1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
            backend/app.log
          retention-days: 7

  # Two environments, each a Render service with its own Neon branch. Both deploys pass the
  # commit SHA as `ref`, so Render builds exactly the commit that passed the checks, not
  # whatever its branch points to by the time the deploy starts.
  deploy-dev:
    needs: [check, backend-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: dev
      url: https://jack-of-all-trades-dev.onrender.com
    steps:
      # When two merges land close together, the older run can finish last; deploying it then would
      # leave dev behind main. Only the run for main's current tip deploys.
      - name: Trigger Render deploy (dev)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL_DEV }}
        run: |
          tip=$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $tip; its own run deploys it."
            exit 0
          fi
          case "$HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -X POST "${HOOK}${sep}ref=${GITHUB_SHA}"

  deploy-prod:
    needs: [check, backend-test, e2e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: production
      url: https://jack-of-all-trades-m86p.onrender.com
    steps:
      - name: Trigger Render deploy (prod)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          case "$HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -X POST "${HOOK}${sep}ref=${GITHUB_SHA}"
